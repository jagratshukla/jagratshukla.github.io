<script type="application/json" id="data">[{"n": 1, "area": "", "ind": "", "problem": "Ad creatives not updated after app UI changes", "agent": "Stale UI ad detector", "how": ["Every time a new app version is released, a script opens the app and records the main screens: home, search, offer, checkout, payment success (Appium + screen recorder, app event logs)", "Still images are taken from every running video ad (Meta Marketing API, FFmpeg)", "Each ad image is matched with the closest screen from the new recording (CLIP image similarity)", "Claude compares each pair and checks if the layout, buttons or prices have changed (Claude Sonnet, vision)", "Output: list of running ads that show the old app, plus new screen recordings the editor can use to update them"], "stack": ["Appium", "screen recorder", "app event logs", "FFmpeg", "CLIP embeddings", "Claude Sonnet (vision)", "Meta Marketing API"], "in": "New app build, live ad creatives", "out": "Stale ad list per release, fresh screen clips", "change": "Ads match what users see when they open the app, editors swap footage instead of re-recording", "tricky": "Small UI tweaks (a colour, a label) trigger false flags. Only changes to layout, prices or key buttons count as stale."}, {"n": 2, "area": "", "ind": "", "problem": "Creator vanity codes (e.g. RAHUL20) used outside the creator's audience", "agent": "Vanity code leak watch", "how": ["Each creator gets a short code to say in videos (e.g. RAHUL20) and a link that applies the code automatically (coupon admin API)", "Every day, a script searches coupon websites and Telegram deal groups for these codes (Playwright, Telethon)", "For every order with the code, check if the buyer clicked the creator's link or saw their content in the last 7 days (AppsFlyer / GA4 data in BigQuery)", "Orders with no link to the creator are marked as outside use (Python)", "If outside use is high, the code is limited to first orders with a daily cap, and the creator is paid only for orders from their own audience (coupon admin API)"], "stack": ["Playwright", "Telethon", "AppsFlyer / GA4", "BigQuery", "Python", "coupon admin API"], "in": "Vanity codes, redemption log, session sources", "out": "Leak alerts, creator payout on non-leaked redemptions", "change": "Creators paid on orders from their own audience", "tricky": "Expiring the code breaks the creator's old reels that people still watch. So the code is restricted, not killed."}, {"n": 3, "area": "", "ind": "", "problem": "Organic creator mentions on YouTube not tracked", "agent": "Creator mention finder", "how": ["Search YouTube for videos that mention the brand or category, and check new videos from relevant creators (YouTube Data API)", "Get each video's subtitles, or convert speech to text where there are none, including Hindi, Telugu and Tamil (yt-dlp, Whisper)", "Find the exact minute where the brand is mentioned (Python)", "Check how viewers reacted at that point: comments that mention that minute, and the most replayed part of the video (YouTube Data API)", "Claude keeps clear, positive mentions (Claude Sonnet)", "Partnerships team gets a list of video links with timestamps, to ask creators for permission to run those clips as ads (Google Sheets)"], "stack": ["YouTube Data API", "yt-dlp", "Whisper", "Claude Sonnet", "Google Sheets"], "in": "Brand + category keywords, creator channel list", "out": "Timestamped shortlist of brand mentions per creator", "change": "Creator ads built from mentions viewers already engaged with", "tricky": "Whisper mishears brand names in Indian accents. Brand name is given as custom vocabulary, plus fuzzy matching on the transcript."}, {"n": 4, "area": "", "ind": "", "problem": "Ad traffic sent to Amazon listings held by unauthorised sellers", "agent": "Buy box guard", "how": ["Every 2 hours, a script checks who the main seller (buy box) is and the price on each Amazon product page, from 3 pincodes (Playwright)", "A table links each Amazon product to the Meta and Google ads that send people to it (Google Sheets)", "If an unauthorised seller is the main seller, or the price is below the agreed minimum, those ads are paused automatically (Meta Marketing API, Google Ads API)", "A test order is placed with that seller to check for old stock or missing warranty", "Claude drafts the complaint to Amazon with the order details. Ads restart when the brand's own seller is back as main seller (Claude Sonnet, Amazon Brand Registry, Slack alert)"], "stack": ["Playwright", "Meta Marketing API", "Google Ads API", "Claude Sonnet", "Amazon Brand Registry", "Slack"], "in": "ASIN list, approved sellers, floor prices, ad set mapping", "out": "Paused ad sets, violation log, complaint drafts", "change": "Ad spend doesn't go to sales by unauthorised sellers", "tricky": "Buy box flips back and forth within hours. A pause needs 2 checks in a row, so ads don't switch on and off."}, {"n": 5, "area": "", "ind": "", "problem": "Resellers counted as consumers in LTV and retention", "agent": "Reseller detector", "how": ["For each customer account, count delivery addresses, units per order, orders per week, and whether a GST number was entered (BigQuery)", "A model finds accounts that look very different from normal customers. The top 200 are checked manually and marked reseller or not (scikit-learn, Isolation Forest)", "A second model learns from those 200 and scores every account each week (scikit-learn, gradient boosting)", "Accounts scored as resellers are tagged in the CRM (CleverTap API)", "They are removed from customer retention and LTV reports, and shared with the B2B team as leads"], "stack": ["BigQuery", "scikit-learn (Isolation Forest, GBM)", "CleverTap API"], "in": "Order history, delivery addresses", "out": "Reseller segment, cohort reports without resellers, B2B lead list", "change": "Consumer cohorts without resellers, resellers passed to B2B team", "tricky": "Big families and gifting season look like reselling. Festive weeks are left out of the features."}, {"n": 6, "area": "", "ind": "", "problem": "Slow response to weather alerts, bandhs and local disruptions", "agent": "Disruption radar", "how": ["Every 15 minutes, the agent checks weather alerts, traffic police and civic updates, and news feeds (Claude Agent SDK, IMD alerts, RSS)", "Claude removes irrelevant items and notes what happened, where, when and how serious it is (Claude Haiku to filter, Claude Sonnet to extract)", "Affected areas are matched with stock and delivery capacity in those pincodes (inventory API)", "Claude drafts push messages and search ad text for each city in the local language, or a list of ads to pause if delivery is stopped (Claude Opus)", "The draft is sent to Slack. Once someone approves it, it goes live (Slack, CleverTap, Google Ads API)"], "stack": ["Claude Agent SDK", "Claude Haiku / Sonnet / Opus", "RSS", "IMD alerts", "inventory API", "CleverTap", "Google Ads API", "Slack"], "in": "Public alert feeds, stock + delivery capacity", "out": "Same-day city campaigns or pause lists, ready to approve", "change": "Campaigns and pauses go out the same day as the event", "tricky": "Promotions during floods can look insensitive. Wording is pre-approved and nothing goes out without a human click."}, {"n": 7, "area": "", "ind": "", "problem": "No alternative offered to users waiting for restock", "agent": "Restock fallback", "how": ["Every day, pull the list of users who asked to be notified when an out-of-stock product is back (BigQuery)", "Estimate the restock date from supplier lead times and past delays (gradient boosting model)", "If restock is unlikely within 7 days, find the closest in-stock alternative by features, price and compatibility (inventory API)", "Send a WhatsApp message with the top 2 alternatives (WhatsApp Cloud API, CleverTap journeys)", "If the original product comes back first, no message is sent"], "stack": ["BigQuery", "gradient boosting model", "inventory API", "WhatsApp Cloud API", "CleverTap journeys"], "in": "Notify-me list, POs, stock levels", "out": "Timed alternative offers to waiting users", "change": "Waiting users get an alternative before they buy elsewhere", "tricky": "Messaging too early annoys people who would have waited. Threshold is tuned on opt-out rate, not just conversion."}, {"n": 8, "area": "", "ind": "", "problem": "Pushes and ad budgets not timed to live cricket moments", "agent": "Match-day trigger", "how": ["On match days, a live score feed is read every few seconds (live score API, websocket)", "Fixed rules spot key moments: innings break, rain delay, close last over, India win (Python)", "Within a minute, a pre-approved push goes out, e.g. a food offer at the innings break (CleverTap API)", "Google search budgets go up for the next 2 hours, then return to normal automatically (Google Ads API)", "After the match, orders and app usage are compared with similar days with no trigger"], "stack": ["Live score API (websocket)", "Python", "CleverTap API", "Google Ads API"], "in": "Live scores, approved message templates", "out": "Moment-based pushes + search budget changes", "change": "Pushes and budget increases go out within minutes of key match moments", "tricky": "Meta budget changes take hours to deliver and can reset learning, so only pushes and search budgets react live. An India loss gets separate templates, no push after a big loss."}, {"n": 9, "area": "", "ind": "", "problem": "Buyers unsure if the smart lock fits their door", "agent": "Door-fit checker", "how": ["A click-to-WhatsApp ad or lead form opens a WhatsApp chat (WhatsApp Cloud API)", "The bot asks for 2 photos: the door edge and the handle side", "Claude reads the photos and notes door material, handle type, current lock and thickness (Claude Sonnet, vision)", "These are checked against a table of which lock model fits which door (compatibility table)", "If it fits, the user gets the model link and an install slot. If not, the bot says so. If unclear, a person reviews the photos (CRM)"], "stack": ["WhatsApp Cloud API", "Claude Sonnet (vision, structured output)", "compatibility table", "CRM"], "in": "Door photos from leads", "out": "Model recommendation per lead, qualified lead list", "change": "More leads convert, fewer wrong-fit returns", "tricky": "Thickness can't be read reliably from a photo. Bot asks the user to hold a card against the door edge for scale."}, {"n": 10, "area": "", "ind": "", "problem": "Festival demand by city not forecast in advance", "agent": "Festival demand forecaster", "how": ["List each state's festivals (Sankranti, Dasara, Onam, Chhath, Bonalu) with this year's dates (Google Sheets)", "Take the last 3 years of searches and orders by category and city, and line them up by days before each festival, since dates change every year (BigQuery)", "A forecasting model predicts demand for each category and city (Prophet)", "Category-city pairs are ranked by expected increase, 3 weeks ahead", "OOH, digital and CRM for the top 20 are planned before demand goes up (summary by Claude Sonnet)"], "stack": ["BigQuery", "Python (Prophet)", "Google Sheets", "Claude Sonnet"], "in": "Search + order history, festival calendar", "out": "Category-city surge forecast, 3 weeks ahead", "change": "Festival media booked before demand peaks", "tricky": "Festivals move on the lunar calendar every year. Data is aligned to days-before-festival, not calendar dates."}, {"n": 11, "area": "", "ind": "", "problem": "Exam and results dates not used to time campaigns", "agent": "Exam calendar targeting", "how": ["The agent checks official notices for JEE, NEET, CUET, state boards, UPSC, SSC and bank exams (Claude Agent SDK)", "Claude reads each notice and notes exam, admit card and result dates by state (Claude Sonnet)", "A campaign calendar is made by state and audience: students or parents (Google Sheets)", "Location-based campaigns start 7-10 days before key dates, e.g. laptops or education loans after results (Google Ads API, Meta Marketing API)", "Searches and orders are compared with the same days last year"], "stack": ["Claude Agent SDK", "Claude Sonnet", "Google Ads API", "Meta Marketing API", "Google Sheets"], "in": "Exam body notices", "out": "Exam-linked campaign calendar by state, live geo campaigns", "change": "Campaigns timed to exam and results days", "tricky": "Notices are scanned PDFs in a different format per exam body, and dates change. Each one is checked by hand and rechecked daily."}, {"n": 12, "area": "", "ind": "", "problem": "Co-marketing partners chosen without data", "agent": "Partner co-marketing scorer", "how": ["For each partner (brand, seller or restaurant): range, rating and cancellation rate (BigQuery)", "For each city and category: number of searches vs orders, to find where users search but don't buy (BigQuery)", "Each partner is scored on how much they offer in those weak areas (Python)", "Top partners are shortlisted for co-branded OOH and app placements (Google Sheets)", "After the campaign, the partner's orders are compared with similar partners who weren't part of it"], "stack": ["BigQuery", "Python", "Google Sheets"], "in": "Partner catalogue, search + order data, ratings", "out": "Ranked partner list for co-marketing", "change": "Co-branded campaigns go to partners in areas where we're weak", "tricky": "Big partners also sell on competing platforms. Score uses the share of their sales through us, not total size."}, {"n": 13, "area": "", "ind": "", "problem": "Competitor offers tracked late", "agent": "Competitor offer log", "how": ["Every day, a script checks competitor ads on Meta Ad Library and Google Ads Transparency Center (Playwright)", "It also checks competitor offer pages and Play Store listings for changes (Playwright)", "A test Android phone with competitor apps installed records every push notification they send (Android notification listener)", "Claude reads the ads and pushes and notes the offer, code and validity (Claude Sonnet, vision)", "Only new offers are sent to Slack (Supabase, Slack)"], "stack": ["Playwright", "Android notification listener", "Claude Sonnet (vision)", "Supabase", "Slack"], "in": "Competitor ad pages, apps, offer pages", "out": "Offer timeline per competitor, same-day alerts", "change": "Response to competitor offers decided the same day", "tricky": "Ad Library API doesn't return commercial ads for India, so it has to be the web page. Selector check runs before every scrape."}, {"n": 14, "area": "", "ind": "", "problem": "Society-level social proof not used in ads", "agent": "Install-photo ads", "how": ["Installers upload 2 photos per installation with the society name (installer app)", "Claude keeps photos where the lock and door are clear, with no faces or flat numbers (Claude Sonnet, vision)", "Installations are counted per society (Python)", "Societies with 10+ installs get a Meta ad targeted around that society, e.g. '40 flats in X use this lock' (Meta Marketing API)", "Clicks and leads are compared with a standard ad in the same area"], "stack": ["Installer app", "Claude Sonnet (vision)", "Python", "Meta Marketing API"], "in": "Install photos, install records", "out": "Society-specific creatives and ad sets", "change": "Ads in a society show installs by neighbours", "tricky": "Customer consent needed to use their door photo. Taken on the install form, flat numbers blurred."}, {"n": 15, "area": "", "ind": "", "problem": "Competitor LinkedIn and Instagram posts and comments analysed manually", "agent": "Competitor post + comment miner", "how": ["Every week, posts are collected from competitor pages and from their founders' and marketing heads' LinkedIn profiles (Apify)", "For each account, posts that got 3x their usual engagement are picked out (Python)", "Claude notes the opening line, format and topic of each (Claude Sonnet, vision)", "Claude reads the comments on those posts and lists unanswered questions and complaints about the competitor (Claude Haiku)", "Output: content briefs based on formats that worked, and a list of questions we can answer (Supabase, Notion API)"], "stack": ["Apify", "Claude Sonnet (vision)", "Claude Haiku", "Supabase", "Notion API"], "in": "Competitor pages + employee profiles", "out": "Weekly briefs, list of unanswered questions from competitor audiences", "change": "Content built on formats that worked and questions competitor audiences are asking", "tricky": "Paid boosts and giveaways inflate engagement. Posts with a paid partnership label or a giveaway are dropped."}, {"n": 16, "area": "", "ind": "", "problem": "Brand mentions in ChatGPT and Gemini checked manually", "agent": "AI answer tracker", "how": ["A fixed list of 50 questions a customer might ask, in English, Hindi and Hinglish", "Every week, the questions are asked to ChatGPT, Gemini, Perplexity and Claude, 3 times each since answers vary (OpenAI, Gemini, Perplexity, Anthropic APIs)", "Claude notes which brands are named, in what order, and which websites are cited as sources (Claude Haiku)", "Results are stored to track change week by week (Supabase)", "The websites cited most often become the target list for PR and content"], "stack": ["OpenAI", "Gemini", "Perplexity", "Anthropic APIs", "Claude Haiku", "Supabase"], "in": "Question list", "out": "Weekly share of mentions, list of cited pages", "change": "List of pages to fix to appear in AI answers", "tricky": "API answers differ from the consumer apps. Spot-checked by hand each month."}, {"n": 17, "area": "", "ind": "", "problem": "Difficult to calculate ROI of OOH campaigns", "agent": "Geo-lift readout", "how": ["Collect 12 weeks of daily orders, new users and brand searches for the campaign city and about 20 cities without OOH (BigQuery, Google Trends)", "Build a model version of the campaign city from a mix of other cities that matched it closely before the campaign, e.g. 40% Madurai, 35% Salem, 25% Tiruchy (CausalImpact / GeoLift in Python)", "During the campaign, the gap between the actual city and the model version is the lift from OOH", "Check the model by testing a fake campaign date. It should show no lift", "Claude writes a one-page summary: lift range, cost per extra order, and limitations (Claude Sonnet)"], "stack": ["BigQuery", "Python (CausalImpact / GeoLift)", "Google Trends", "Claude Sonnet"], "in": "City-level orders, campaign dates and spend", "out": "A one-page readout per campaign", "change": "Lift range + cost per incremental order for every OOH campaign", "tricky": "Small cities are too noisy. Minimum detectable lift is worked out before the campaign, to know if it's measurable at all."}, {"n": 18, "area": "", "ind": "", "problem": "OOH sites chosen on vendor traffic claims", "agent": "Site relevance scorer", "how": ["Convert each vendor site's address into map coordinates (Google Maps API)", "Plot where our orders come from on a map, in small hexagon areas (BigQuery, H3)", "Score each site by the number of orders within 2 km, counting only the side of the road the board faces (geopandas)", "Divide by the site rate to rank sites by orders reached per rupee", "A Street View photo of each shortlisted site is pulled to check visibility (Street View Static API)"], "stack": ["BigQuery", "Python (geopandas, H3)", "Google Maps + Street View Static API"], "in": "Candidate sites, orders by pincode", "out": "A ranked shortlist with a map", "change": "Sites shortlisted near areas with high orders", "tricky": "A board faces one direction of traffic. Demand is counted only on the side that sees it."}, {"n": 19, "area": "", "ind": "", "problem": "Society activations chosen without data", "agent": "Society scorer", "how": ["Build a society list from property websites and our install records: flats, building age, price range, location (Playwright, Google Maps API)", "Add results from past activations: footfall, leads and sales (Google Sheets)", "A model learns which society features led to more sales (scikit-learn, gradient boosting)", "New societies are ranked by expected sales per rupee spent", "The model is updated after each month's activations"], "stack": ["Python (scikit-learn)", "Playwright", "Google Maps API", "Google Sheets"], "in": "Society list, past activation results", "out": "Ranked list of societies for next month", "change": "Activation budget goes to societies likely to convert", "tricky": "Few past activations, so the model overfits. Kept to 5-6 features and compared against a simple flat-count rule."}, {"n": 20, "area": "", "ind": "", "problem": "Fleet branding verified only through vendor photos", "agent": "Fleet branding verification", "how": ["Take the branded vehicle numbers from the PO", "Get each vehicle's GPS data from the rider app or the fleet partner's tracking system (fleet telematics API)", "For each vehicle and day: did it run, how many km, which areas (BigQuery, geopandas, H3)", "Compare with the contracted days and areas", "Pay the invoice only for verified days, and report reach by area (Google Sheets)"], "stack": ["Fleet telematics API", "BigQuery", "Python (geopandas, H3)", "Google Sheets"], "in": "Branded vehicle list, GPS pings", "out": "Running days + areas per branded vehicle", "change": "Vehicle branding paid on verified days, with area-level reach", "tricky": "Only works for fleets that are tracked; autos and private cabs are out. GPS proves the vehicle ran, not that it carried the wrap, so random photo checks need number plate + wrap in one frame."}, {"n": 21, "area": "", "ind": "", "problem": "DOOH slots not matched to customer footfall hours", "agent": "Footfall-timed DOOH", "how": ["Use our app data to see which areas have the most app opens and orders, by hour (BigQuery, H3)", "Find the busiest hours for each area, e.g. Fri 8-11 pm (Python)", "Shortlist digital screens in those areas", "Book screen time only in those busy hours (DOOH scheduling API)", "Compare new users from those areas with similar areas that had no screens"], "stack": ["BigQuery", "Python (H3)", "DOOH scheduling API", "Google Sheets"], "in": "Sessions + orders by location and hour", "out": "Screen plan by area and time slot", "change": "DOOH spend runs only in the hours customers are around", "tricky": "Many people in a busy hex are already customers. Measured on new users there, not total orders."}, {"n": 22, "area": "", "ind": "", "problem": "Regional creators chosen without checking audience location", "agent": "Regional creator audit", "how": ["Collect the creator's last 30 posts and 200 comments per post (Apify)", "Claude identifies the language of each comment: Telugu, Tamil, Hindi or English (Claude Haiku, Batch API)", "City names in comments and the creator's tagged locations show which states the audience is from (Python)", "Check for sudden jumps in followers and bot-like comments", "Score each creator by the share of audience in the campaign's state and language", "Suggest a price based on views from that audience (Google Sheets)"], "stack": ["Apify", "Claude Haiku (Batch API)", "Python", "Google Sheets"], "in": "Creator handles, campaign states + languages", "out": "Audience language + state mix per creator, price range", "change": "Regional budgets go to creators whose audience is in that region", "tricky": "Many Telugu and Tamil users comment in English or Roman script. Language is read from the words, not the script."}]</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('data').textContent),list=document.getElementById('list'),q=document.getElementById('q'),cnt=document.getElementById('count'),areasEl=null;
  var area='',open={};
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function pad(n){return (n<10?'0':'')+n}
  var areas=[];D.forEach(function(d){if(areas.indexOf(d.area)<0)areas.push(d.area)});
  D.forEach(function(d){d._s=[d.area,d.ind,d.problem,d.agent,d.how.join(' '),d.stack.join(' '),d.in,d.out,d.change,d.tricky].join(' ').toLowerCase()});
  function chips(){if(!areasEl)return;
    areasEl.innerHTML='<button type="button" class="chip mono" data-a="" aria-pressed="'+(area===''?'true':'false')+'">All<i>'+D.length+'</i></button>'+areas.map(function(a){var n=D.filter(function(d){return d.area===a}).length;return '<button type="button" class="chip mono" data-a="'+esc(a)+'" aria-pressed="'+(area===a?'true':'false')+'">'+esc(a)+'<i>'+n+'</i></button>'}).join('');
  }
  function row(d){
    var o=!!open[d.n];
    return '<article class="row'+(o?' open':'')+'" id="a'+d.n+'"><button type="button" class="row__h" data-n="'+d.n+'" aria-expanded="'+o+'"><span class="row__n mono">'+pad(d.n)+'</span><span class="row__a">'+esc(d.agent)+'</span><span class="row__p">'+esc(d.problem)+'</span><span class="row__x" aria-hidden="true">+</span></button>'
      +'<div class="det"><div class="det__g"><div><h3 class="mono">How it works</h3><ol>'+d.how.map(function(s){return '<li><span>'+esc(s)+'</span></li>'}).join('')+'</ol>'
      +'<div class="trk"><h3 class="mono">Limitation</h3><p>'+esc(d.tricky)+'</p></div></div>'
      +'<div class="side"><div><h3 class="mono">Result</h3><p>'+esc(d.change)+'</p></div><div><h3 class="mono">Input</h3><p class="mut">'+esc(d.in)+'</p></div><div><h3 class="mono">Output</h3><p class="mut">'+esc(d.out)+'</p></div><div><h3 class="mono">Stack</h3><div class="tags">'+d.stack.map(function(s){return '<button type="button" class="tag" data-t="'+esc(s.replace(/\s*\(.*\)$/,''))+'">'+esc(s)+'</button>'}).join('')+'</div></div></div></div></div></article>';
  }
  function draw(){
    var t=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    var r=D.filter(function(d){return (!area||d.area===area)&&t.every(function(w){return d._s.indexOf(w)>=0})});
    cnt.textContent=r.length+' of '+D.length;
    if(!r.length){list.innerHTML='<p class="empty">No agents match. Try a tool name like BigQuery, or clear the search.</p>';return}
    var html='',cur=null;
    r.forEach(function(d){if(d.area&&d.area!==cur){cur=d.area;html+='<div class="grp"><h2>'+esc(cur)+'</h2><span class="mono mut">'+r.filter(function(x){return x.area===cur}).length+' agents</span></div>'}html+=row(d)});
    list.innerHTML=html;
  }
  if(areasEl)areasEl.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;area=b.getAttribute('data-a');chips();draw()});
  list.addEventListener('click',function(e){
    var t=e.target.closest('[data-t]');
    if(t){q.value=t.getAttribute('data-t');area='';chips();draw();window.scrollTo({top:document.querySelector('.bar').offsetTop,behavior:'smooth'});return}
    var b=e.target.closest('[data-n]');if(!b)return;var n=+b.getAttribute('data-n'),el=b.parentNode;open[n]=!open[n];el.classList.toggle('open',open[n]);b.setAttribute('aria-expanded',open[n]);
  });
  q.addEventListener('input',draw);
  chips();draw();
  var h=(location.hash||'').match(/^#a(\d+)$/);if(h){open[+h[1]]=true;draw();var el=document.getElementById('a'+h[1]);if(el)el.scrollIntoView()}
})();
</script>
</body>
</html>
